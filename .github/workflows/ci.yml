name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: swift --version && xcodebuild -version
      - name: Resolve packages
        run: swift package resolve
      - name: Build (debug)
        run: swift build
      - name: Run tests
        run: swift test
      - name: Package .app
        run: ./scripts/build-app.sh release
      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClaudeHelper.app
          path: dist/ClaudeHelper.app
